# This is a Databricks asset bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: 7555a471-83f0-4d1a-8ef9-4f3f97a67446

include:
  - resources/**/*.yml

variables:
  catalog:
    description: The Unity Catalog catalog name
  schema:
    description: The Unity Catalog schema name

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: dbc-5b0e5a2f-35e6.cloud.databricks.com
      root_path: /Workspace/DEV/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
    permissions:
      - user_name: kalyan.t@alphaleo.tech
        level: CAN_MANAGE
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false
  prod:
    mode: production
    workspace:
      host: dbc-5b0e5a2f-35e6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kalyan.t@alphaleo.tech to make sure we only have a single copy.
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: kalyan.t@alphaleo.tech
        level: CAN_MANAGE

